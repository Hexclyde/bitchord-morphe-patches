[package]
name = "bitchord-ipfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[lib]
name = "bitchord_ipfs"
crate-type = ["cdylib", "rlib"]

[dependencies]
beetswap = "=0.5.0"
blockstore = "=0.8.0"
cid = "=0.11.3"
futures = "=0.3.31"
if-addrs = "=0.15.0"
jni = "=0.21.1"
libp2p = { version = "=0.56.0", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "macros", "identify", "ed25519"] }
multihash-codetable = { version = "=0.1.4", features = ["sha2"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["rt", "sync", "time", "macros", "net"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[patch.crates-io]
beetswap = { path = "vendor/beetswap" }
