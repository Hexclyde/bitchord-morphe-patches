[package]
name = "bitchord-soulseek"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "bitchord_soulseek"
crate-type = ["cdylib", "rlib"]

[dependencies]
soulseek-rs-lib = { path = "../../vendor/soulseek-rs-lib", features = ["embedded"] }
jni = { version = "=0.21.1", default-features = false }
serde_json = "=1.0.145"
nostr-sdk = { version = "=0.44.0", default-features = false, features = ["nip44"] }
tokio = { version = "=1.48.0", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
async-wsocket = { version = "=0.13.2", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
