[package]
name = "soulseek-rs-lib"
version = "19.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/michel/soulseek-rs"
authors = ["Michel de Graaf"]
description = "Pinned Soulseek protocol library for the on-phone BitChord adapter"

[lib]
name = "soulseek_rs"
path = "src/lib.rs"

[features]
default = []
embedded = []

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
